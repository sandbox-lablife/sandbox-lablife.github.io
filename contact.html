<noscript><p class="note">メールのアドレスは JavaScript を有効にすると表示されます。</p></noscript>

<script>
// メールのアドレスを、そのままの文字では置かず、表示するときに組み立てる(自動収集のプログラム対策。完全ではない)
(function(){
  var a=['sandboxlablife','gmail.com'].join('@');
  var el=document.getElementById('mail');
  el.href='mailto:'+a+'?subject='+encodeURIComponent('sandbox-lablife');
  el.textContent=a;
})();
